# Checks every push to main and every pull request: the typecheck, the unit tests and the build of the view Mirador
# loads (dist/view.js); that hosts/mirador/api.ts still fits Mirador's plugin API; and the built view end to end, in
# Chrome and in WebKit framed as Mirador frames it. release.yml calls it (workflow_call) so a release passes the same
# gates.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  # A call from release.yml runs in the caller's group, so it gets its own prefix rather than cancelling a push's run.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The Mirador release whose plugin API and canvas framing the checks use (sodre90/mirador, MIT). Bumping it is a
  # deliberate change: it is the Mirador version the plugin is known to work with.
  MIRADOR_REF: v0.12.0

jobs:
  test:
    # Mirador is macOS-only; its views run in WKWebView.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test tests
      - run: bun run build

  api:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      # Mirador's shared/ folder, and the two web/ files its types reach.
      - uses: actions/checkout@v5
        with:
          repository: sodre90/mirador
          ref: ${{ env.MIRADOR_REF }}
          path: .mirador
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /shared/
            /web/problem-text.ts
            /web/i18n/en/problems.ts

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - run: bun install --frozen-lockfile
      - run: bun run api-compat
        env:
          MIRADOR_SHARED: ${{ github.workspace }}/.mirador/shared

  e2e:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/checkout@v5
        with:
          repository: sodre90/mirador
          ref: ${{ env.MIRADOR_REF }}
          path: .mirador
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /shared/
            /web/problem-text.ts
            /web/i18n/en/problems.ts

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - run: bun install --frozen-lockfile
      - run: bunx playwright-core install webkit

      # Builds the view, then runs a full mock review in the runner's Chrome, and in WebKit framed as Mirador frames it.
      - run: bun run e2e
        env:
          MIRADOR_CANVAS: ${{ github.workspace }}/.mirador/shared/canvas-document.ts

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: e2e-screenshots-${{ github.sha }}
          path: .harness/e2e/
          retention-days: 7
          if-no-files-found: ignore
