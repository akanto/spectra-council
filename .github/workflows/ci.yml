# Checks every push to main and every pull request: the typecheck, the unit tests and the build of the view Mirador
# loads (dist/view.js). release.yml calls it (workflow_call) so a release passes the same gates.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  # A call from release.yml runs in the caller's group, so it gets its own prefix rather than cancelling a push's run.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Mirador is macOS-only; its views run in WKWebView.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test tests
      - run: bun run build
